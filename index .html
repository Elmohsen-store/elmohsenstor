<script>
if(!window.supabaseClient){throw new Error('تعذر تهيئة Supabase. راجع config.js واتصال الإنترنت.')}
const db=window.supabaseClient;const $=id=>document.getElementById(id);const Q=new URLSearchParams(location.search);const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));const money=n=>Number(n||0).toLocaleString('ar-EG')+' ج.م';const CK='al_mohsen_cart';const toast=m=>{let x=$('toast');if(x){x.textContent=m;x.style.display='block';setTimeout(()=>x.style.display='none',2000)}};async function session(){return(await db.auth.getSession()).data.session}const ADMIN_UID='909bc6ab-d966-49f3-b8e9-3b59d091868c';async function me(){let s=await session();if(!s)return null;let r=(await db.from('profiles').select('*').eq('id',s.user.id).maybeSingle()).data;if(s.user.id===ADMIN_UID)return {...(r||{}),id:s.user.id,account_type:'admin',full_name:r?.full_name||s.user.email};return r}async function guard(){let s=await session();if(!s){location.href='index.html?page=login&next='+encodeURIComponent(location.href);return null}return s}async function logout(){await db.auth.signOut();location.href='index.html'}function guest(){try{return JSON.parse(localStorage.getItem(CK)||'[]')}catch{return[]}}function save(c){localStorage.setItem(CK,JSON.stringify(c))}async function sync(){let s=await session();if(!s)return;const pending=guest();for(const x of pending){const {error}=await db.from('cart_items').upsert({user_id:s.user.id,product_id:x.id,quantity:x.qty},{onConflict:'user_id,product_id'});if(error){console.error('cart sync:',error);toast('تعذر مزامنة السلة؛ لم يتم حذف السلة المحلية');return}}save([])}async function cart(){
 const s=await session();
 if(!s)return guest();
 const {data,error}=await db.from('cart_items').select('id,product_id,quantity,products(id,name,price,image_url,stock)').eq('user_id',s.user.id);
 if(error){console.warn('cart read failed; using local cart:',error.message);return guest();}
 const remote=(data||[]).filter(x=>x.products).map(x=>({...x.products,qty:Number(x.quantity)||1,cart_id:x.id}));
 const local=guest();
 for(const item of local){const found=remote.find(x=>String(x.id)===String(item.id));if(!found)remote.push(item);}
 return remote;
}
function putGuestProduct(product){
 const c=guest();
 const x=c.find(item=>String(item.id)===String(product.id));
 if(x){if(Number(x.stock)>=0&&Number(x.qty)>=Number(x.stock)){toast('الكمية المطلوبة غير متاحة');return false;}x.qty=Number(x.qty||0)+1;}
 else{if(Number(product.stock)<=0){toast('المنتج غير متاح حالياً');return false;}c.push({...product,qty:1});}
 save(c);toast('تمت الإضافة للسلة');return true;
}
async function add(id){
 try{
  const {data:product,error:productError}=await db.from('products').select('id,name,price,image_url,stock,is_active').eq('id',id).maybeSingle();
  if(productError||!product||product.is_active===false){toast('تعذر العثور على المنتج أو أنه غير متاح');return false;}
  const s=await session();
  if(!s)return putGuestProduct(product);
  const {data:existing,error:readError}=await db.from('cart_items').select('id,quantity').eq('user_id',s.user.id).eq('product_id',id).maybeSingle();
  if(readError){console.warn('cart table/policy unavailable; saving locally:',readError.message);return putGuestProduct(product);}
  const nextQty=Number(existing?.quantity||0)+1;
  if(Number(product.stock)<=Number(existing?.quantity||0)){toast('الكمية المطلوبة غير متاحة');return false;}
  const result=existing
   ? await db.from('cart_items').update({quantity:nextQty}).eq('id',existing.id).eq('user_id',s.user.id)
   : await db.from('cart_items').insert({user_id:s.user.id,product_id:id,quantity:1});
  if(result.error){console.warn('cart write failed; saving locally:',result.error.message);return putGuestProduct(product);}
  toast('تمت الإضافة للسلة');return true;
 }catch(error){console.error('add to cart failed:',error);toast('حدث خطأ أثناء الإضافة للسلة');return false;}
}

async function product(){layout('تفاصيل المنتج');let id=Q.get('id'),{data:p,error:productError}=await db.from('products').select('*').eq('id',id).single();if(!p){document.querySelector('main').innerHTML='<div class="empty">المنتج غير موجود.</div>';return}let desc=String(p.description||('شراء '+p.name+' من المحسن ستور.')).replace(/\s+/g,' ').trim();let seller='المحسن ستور';document.title=`${p.name} - المحسن ستور`;let setMeta=(name,content)=>{let m=document.querySelector(`meta[name="${name}"]`);if(!m){m=document.createElement('meta');m.name=name;document.head.appendChild(m)}m.content=content};setMeta('description',desc.slice(0,160));let canonical=document.querySelector('link[rel="canonical"]');if(!canonical){canonical=document.createElement('link');canonical.rel='canonical';document.head.appendChild(canonical)}canonical.href=new URL(`index.html?page=product&id=${encodeURIComponent(p.id)}`,location.href).href;let oldLd=document.getElementById('product-jsonld');if(oldLd)oldLd.remove();let ld=document.createElement('script');ld.id='product-jsonld';ld.type='application/ld+json';ld.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Product','name':p.name,'description':desc,'image':p.image_url?[p.image_url]:[],'sku':String(p.id),'category':p.category||undefined,'brand':{'@type':'Brand','name':'المحسن ستور'},'offers':{'@type':'Offer','url':canonical.href,'priceCurrency':'EGP','price':Number(p.price||0).toFixed(2),'availability':Number(p.stock)>0?'https://schema.org/InStock':'https://schema.org/OutOfStock','seller':{'@type':'Organization','name':seller}}},(k,v)=>v===undefined?undefined:v);document.head.appendChild(ld);document.querySelector('main').innerHTML=`<div class="card"><div class="row product-detail-row"><div class="product-detail-image"><img class="product-detail-img" src="${esc(p.image_url||'')}" alt="${esc(p.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="product-detail-fallback" style="display: async function reviewSeller(id,status){let {data:a,error:ae}=await db.from('seller_applications').select('user_id').eq('id',id).single();if(ae||!a)return toast('تعذر تحميل طلب البائع: '+(ae?.message||''));let {error:ue}=await db.from('seller_applications').update({status,reviewed_by:(await session()).user.id,reviewed_at:new Date().toISOString()}).eq('id',id);if(ue)return toast('تعذر تحديث الطلب: '+ue.message);if(status==='approved'){let {error:pe}=await db.from('profiles').update({account_type:'seller'}).eq('id',a.user_id);if(pe)return toast('تم تحديث الطلب لكن تعذر تفعيل حساب البائع: '+pe.message)}toast('تم تحديث طلب البائع');admin()}async function setOrderStatus(id,status){let {error}=await db.from('orders').update({status}).eq('id',id);if(error)return toast('تعذر تحديث الطلب: '+error.message);toast('تم تحديث حالة الطلب');admin()}async function toggleProduct(id,v){
  const ok=confirm('سيتم حذف المنتج نهائيًا من المتجر. هل تريد المتابعة؟');
  if(!ok)return;
  const buttons=[...document.querySelectorAll('button')];
  const button=buttons.find(b=>(b.getAttribute('onclick')||'').includes('toggleProduct')&&(b.getAttribute('onclick')||'').includes(String(id)));
  if(button){button.disabled=true;button.textContent='جارٍ الحذف...'}
  try{
    const {data,error}=await db.from('products').delete().eq('id',id).select('id').maybeSingle();
    if(error)throw error;
    if(!data)throw new Error('لم يتم حذف المنتج. قد لا تملك صلاحية الحذف في Supabase (سياسات RLS).');
    toast('تم حذف المنتج بنجاح');
    await adminProducts();
  }catch(err){
    toast('تعذر حذف المنتج: '+(err.message||'خطأ غير معروف'));
    if(button){button.disabled=false;button.textContent='حذف المنتج'}
    console.error('delete product:',err);
  }
}
window.toggleProduct=toggleProduct;

async function addresses(){layout('عناويني');let s=await guard();if(!s)return;document.querySelector('main').innerHTML='<div class="container"><form id="f" class="card"><h2>إضافة عنوان</h2><input id="n" placeholder="الاسم" required><input id="ph" placeholder="الهاتف" required><input id="c" placeholder="المحافظة/المدينة" required><textarea id="a" placeholder="العنوان" required></textarea><button>حفظ</button></form><div id="list"></div></div>';async function load(){let {data}=await db.from('addresses').select('*').eq('user_id',s.user.id);$('list').innerHTML=(data||[]).map(x=>`<div class="card" style="margin-top:12px"><b>${esc(x.full_name)}</b><p>${esc(x.phone)} — ${esc(x.city)}</p><p>${esc(x.address)}</p><button class="danger" onclick="delAddr(${x.id})">حذف</button></div>`).join('')}window.delAddr=async id=>{await db.from('addresses').delete().eq('id',id);load()};$('f').onsubmit=async e=>{e.preventDefault();await db.from('addresses').insert({user_id:s.user.id,full_name:$('n').value,phone:$('ph').value,city:$('c').value,address:$('a').value});e.target.reset();load()};load()}
async function addProduct(){layout('إضافة منتج');let s=await guard();if(!s)return;let p=await me();if(p?.account_type!=='seller'&&p?.account_type!=='admin')return account();document.querySelector('main').innerHTML='<div class="container"><div class="section-title"><h1>إضافة منتج جديد</h1><a class="btn secondary" href="'+(p.account_type==='admin'?'index.html?page=admin-products':'index.html?page=seller-products')+'">رجوع</a></div><form id="f" class="card"><input id="n" placeholder="اسم المنتج" required><textarea id="d" placeholder="الوصف"></textarea><div class="row"><input id="pr" type="number" min="0.01" step="0.01" placeholder="السعر" required><input id="st" type="number" min="0" step="1" placeholder="الكمية" required></div><input id="cat" placeholder="القسم"><input id="img" type="file" accept="image/*"><button type="submit">＋ إضافة ونشر المنتج</button></form></div>';$('f').onsubmit=async e=>{e.preventDefault();let url=null,f=$('img').files[0],button=$('f').querySelector('button');if(Number($('pr').value)<=0||Number($('st').value)<0)return alert('أدخل سعرًا وكمية صحيحين.');button.disabled=true;button.textContent='جارٍ إضافة المنتج...';try{if(f){let path=s.user.id+'/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),u=await db.storage.from('products').upload(path,f);if(u.error)throw u.error;url=db.storage.from('products').getPublicUrl(path).data.publicUrl}let {data:created,error}=await db.from('products').insert({name:$('n').value.trim(),description:$('d').value.trim(),price:Number($('pr').value),stock:Number($('st').value),category:$('cat').value.trim(),image_url:url,seller_id:s.user.id,is_active:true}).select('id').single();if(error)throw error;if(!created?.id)throw new Error('لم يتم تأكيد إضافة المنتج من قاعدة البيانات');toast('تمت إضافة المنتج بنجاح');location.href=p.account_type==='admin'?'index.html?page=admin-products':'index.html?page=seller-products'}catch(err){alert('تعذر إضافة المنتج: '+(err.message||'خطأ غير معروف'));button.disabled=false;button.textContent='＋ إضافة ونشر المنتج'}}}
async function sellerProducts(){layout('منتجاتي');let s=await guard();if(!s)return;let {data}=await db.from('products').select('*').eq('seller_id',s.user.id);document.querySelector('main').innerHTML='<div class="container"><a class="btn" href="index.html?page=add-product">+ إضافة منتج</a><div class="grid" style="margin-top:18px">'+((data||[]).map(x=>`<div class="card"><h3>${esc(x.name)}</h3><p class="price">${money(x.price)}</p><p>المخزون: ${x.stock}</p><button class="danger" onclick="delProd(${JSON.stringify(x.id)})">حذف</button></div>`).join('')||'<div class="empty">لا توجد منتجات.</div>')+'</div></div>'}async function delProd(id){
  if(!confirm('حذف المنتج نهائيًا؟'))return;
  const {data,error}=await db.from('products').delete().eq('id',id).select('id').maybeSingle();
  if(error){toast('تعذر حذف المنتج: '+error.message);return}
  if(!data){toast('لم يتم حذف المنتج. تحقق من صلاحيات Supabase.');return}
  toast('تم حذف المنتج بنجاح');
  await sellerProducts();
}
window.delProd=delProd;

const LOGIN_MARKUP = "<div class=\"login-box\"><h1 id=\"storeTitle\">المحسن ستور</h1><h2 id=\"title\">تسجيل الدخول</h2>\n<div id=\"signupFields\" class=\"seller\">\n<label>نوع الحساب<select id=\"accountType\"><option value=\"buyer\">مشتري</option><option value=\"seller\">بائع</option></select></label>\n<label id=\"nameWrap\" class=\"seller\">اسمك بالكامل<input id=\"fullName\" type=\"text\" placeholder=\"الاسم بالكامل\" autocomplete=\"name\"></label>\n<label id=\"storeWrap\" class=\"seller\">اسم المتجر أو النشاط<input id=\"storeName\" type=\"text\" placeholder=\"اسم المتجر\"></label>\n<label id=\"addressWrap\" class=\"seller\">العنوان / مكان النشاط<input id=\"address\" type=\"text\" placeholder=\"العنوان\"></label>\n</div>\n<input id=\"email\" type=\"email\" placeholder=\"البريد الإلكتروني\" autocomplete=\"email\">\n<input id=\"phone\" type=\"tel\" placeholder=\"رقم الهاتف\" autocomplete=\"tel\" style=\"display:none\">\n<input id=\"password\" type=\"password\" placeholder=\"كلمة المرور\" autocomplete=\"current-password\">\n<button id=\"action\" type=\"button\">دخول</button>\n<div class=\"link\"><a href=\"#\" id=\"toggle\">ليس لديك حساب؟ إنشاء حساب</a></div><p id=\"msg\" class=\"msg\" role=\"alert\"></p>\n<p class=\"small\">بيانات البائع الأساسية (الاسم والبريد والهاتف وبيانات النشاط) تصل إلى المدير للمراجعة. كلمة المرور لا يتم حفظها أو إرسالها للمدير.</p></div>\n";
page().catch(e=>{console.error('Store page error:',e);let main=document.querySelector('main');if(main)main.innerHTML='<div class="container"><div class="card empty">حدث خطأ أثناء تحميل الصفحة. حدّث الصفحة، وإذا استمرت المشكلة راجع إعدادات Supabase.<\/div><\/div>'});

async function loginPage(){
 document.body.classList.add('login-mode');
 document.body.innerHTML = `<main>${LOGIN_MARKUP}</main><div id="toast" class="toast"></div>`;
 const loginDb=window.supabaseClient; const login$=id=>document.getElementById(id); let signupMode=false;
 function refreshType(){const seller=login$('accountType').value==='seller';login$('nameWrap').classList.add('show');['storeWrap','addressWrap'].forEach(id=>login$(id).classList.toggle('show',seller));}
 login$('accountType').onchange=refreshType;
 login$('toggle').onclick=e=>{e.preventDefault();signupMode=!signupMode;login$('title').textContent=signupMode?'إنشاء حساب':'تسجيل الدخول';login$('action').textContent=signupMode?'إنشاء الحساب':'دخول';login$('toggle').textContent=signupMode?'لديك حساب؟ تسجيل الدخول':'ليس لديك حساب؟ إنشاء حساب';login$('signupFields').classList.toggle('show',signupMode);login$('phone').style.display=signupMode?'block':'none';login$('msg').textContent='';if(signupMode)refreshType();};
 login$('action').onclick=async()=>{const email=login$('email').value.trim(),password=login$('password').value,phone=login$('phone').value.trim();login$('msg').textContent='';if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){login$('msg').textContent='اكتب بريدًا إلكترونيًا صحيحًا.';return;}if(signupMode&&!phone){login$('msg').textContent='اكتب رقم الهاتف.';return;}if(signupMode&&!/^[0-9+\s()-]{7,20}$/.test(phone)){login$('msg').textContent='اكتب رقم هاتف صحيح.';return;}if(password.length<6){login$('msg').textContent='كلمة المرور يجب أن تكون 6 أحرف على الأقل.';return;}if(signupMode&&!login$('fullName').value.trim()){login$('msg').textContent='اكتب اسمك بالكامل.';return;}if(signupMode&&login$('accountType').value==='seller'&&(!login$('storeName').value.trim()||!login$('address').value.trim())){login$('msg').textContent='اكتب الاسم واسم المتجر والعنوان للبائع.';return;}login$('action').disabled=true;try{if(signupMode){const type=login$('accountType').value;const {data,error}=await loginDb.auth.signUp({email,password,options:{data:{phone,account_type:type,full_name:login$('fullName').value.trim(),store_name:login$('storeName').value.trim(),address:login$('address').value.trim()}}});if(error)throw error;if(data.session){const uid=data.session.user.id;const {data:profile}=await loginDb.from('profiles').select('account_type').eq('id',uid).maybeSingle();const typ=uid===ADMIN_UID?'admin':profile?.account_type;location.href='index.html?page='+(typ==='seller'?'seller':typ==='admin'?'admin':'buyer');}else login$('msg').textContent=type==='seller'?'تم إنشاء طلب البائع. بعد تأكيد البريد، سيظهر طلبك للمدير للمراجعة.':'تم إنشاء الحساب. إذا ظهر طلب تأكيد البريد، أكّد بريدك ثم سجّل الدخول.';}else{const {data,error}=await loginDb.auth.signInWithPassword({email,password});if(error)throw error;const uid=data.user.id;const {data:profile}=await loginDb.from('profiles').select('account_type').eq('id',uid).maybeSingle();const typ=uid===ADMIN_UID?'admin':profile?.account_type;location.href='index.html?page='+(typ==='seller'?'seller':typ==='admin'?'admin':'buyer');}}catch(e){login$('msg').textContent=e.message||'حدث خطأ غير متوقع. تأكد من إعداد Supabase ومفتاحه.';}finally{login$('action').disabled=false;}};
}
