}

}

}

}
.nav-inner{

}

}
.hero-shop h1{
    font-size:36px;

}
.benefits{
    max-width:1200px;

}
.benefits div{

}

}

}
.section-title h2{
    margin:0;
}
.section-title span{

}

    display:flex;

}

.product-img{

    z-index:1;
}
.fallback-icon
{position:absolute;

}
.product-body{
    padding:15px;
}
.product-name{
    display:block;

.price{

}
.cart-btn{
    width:100%;
    border-radius:6px;
    font-weight:bold;
}
.card{
    background:#fff;
    border:1px solid #eee;
    border-radius:10px;
    padding:18px;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}
.row{
    display:flex;
    gap:15px;
}
.btn{
    display:inline-block;
    background:#a00303;
    color:#fff;
    padding:10px 16px;
    border-radius:6px;
}
.secondary{
    background:#333;
    color:#fff;
}
.danger{
    background:#b00020;
    color:#fff;
}
.empty{
    text-align:center;
    background:#fff;
    border:1px dashed #ccc;

    border-radius:10px;
    color:#777;
}
.muted{
    color:#777;
}
.toast{
    position:fixed;
    bottom:25px;
    right:25px;

}
.badge{
    background:#eee;
    padding:5px 10px;
    border-radius:15px;
}
input,textarea,select{

}
form button{
    background:#a00303;
    color:#fff;
    padding:11px 18px;

}
@media(max-width:900px){
    .product-grid

    }
    .header-inner{
        flex-wrap:wrap;
    }

    }
    .benefits{
        grid-template-columns:repeat(2,1fr);

@media(max-width:600px)
{

/* ===== القائمة الجانبية الجديدة ===== */
.menu-toggle{position:fixed;top:16px;right:18px;
    width:48px;height:48px;border:0;
    border-radius:10px;
    background:#a00303;color:#fff;
    font-size:28px;line-height:1;
    z-index:9999;
    -shadow:0 5px 18px #0003;
    display:flex;align-items:center;
    justify-content:center}
.side-menu{position:fixed;
    top:0;
    right:-330px;
    width:310px;
    max-width:85vw;
    height:100vh;background:#fff;
    z-index:1003;
    box-shadow:-8px 0 30px #0002;
    transition:right .25s ease;
    overflow-y:auto}
.side-overlay{position:fixed;inset:0;
    background:#0007;z-index:1002;
    opacity:0;visibility:hidden;
    transition:.25s}
.menu-open .side-menu{right:0}
.menu-open .side-overlay{opacity:1;
    visibility:visible}
.side-head{height:76px;padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;

.side-brand{font-size:24px;
    font-weight:900;
    color:#580a0a}.side-brand span{color:#222}
.side-close{width:42px;height:42px;

    background:#f2f2f2;color:#222;font-size:30px;
    line-height:1}
.side-links{padding:12px}.side-links a{
    display:block;padding:15px 14px;

}
    .side-links a:hover{
        background:#f7e8e8;
        color:#a00303;
    }
body.menu-open{
    overflow:hidden;
}
@media(max-width:600px){

    .shop-header

/* ===== 🎨 عدّل الألوان من هنا فقط ===== */
:root{
  --page-bg:#a00303;       /* خلفية الصفحة */
  --box-bg:#967e7e;        /* خلفية الصندوق */
  --text-color:#222222;    /* لون الكتابة */
  --muted-color:#666666;  /* النص الصغير */
  --input-border:#241d1d; /* حدود الخانات */
  --button-bg:#3f3c3c;    /* لون الزر */
  --button-text:#8b8585;  /* كتابة الزر */
  --message-color:#960505;
}

/* ===== 📐 شكل الصفحة ===== */
*{box-sizing:border-box;font-family:Arial,sans-serif}
body.login-mode{
  margin:0;
  background:var(--page-bg);
  min-height:100vh;
  display:grid;
  place-items:center;
  color:var(--text-color);
}
.login-box{
  width:min(440px,92%);
  background:var(--box-bg);
  color:var(--text-color);
  border-radius:15px;
  padding:25px;
  box-shadow:0 5px 25px #0003;
}

/* ===== 📝 الخانات ===== */
body.login-mode input,body.login-mode select{
  width:100%;
  padding:20px;
  margin:7px 0;
  border:1px solid var(--input-border);
  border-radius:8px;
  background:#555050;
  color:var(--text-color);
}

/* ===== 🔘 الزر ===== */
body.login-mode button{
  width:100%;
  background:var(--button-bg);
  color:var(--button-text);
  border:0;
  padding:20px;
  border-radius:8px;
  margin-top:10px;
  cursor:pointer;
}
body.login-mode button:disabled{opacity:.6;cursor:not-allowed}

/* ===== 🔗 الروابط والرسائل ===== */
.login-box .link{text-align:center;margin-top:14px}
.login-box .link a{color:var(--button-bg)}
.login-box .msg{color:var(--message-color);min-height:20px;line-height:1.7}
.login-box .small{font-size:13px;color:var(--muted-color);margin-top:6px;line-height:1.7}

/* ===== 🛒 بيانات البائع ===== */
.login-box .seller{display:none}
.login-box .seller.show{display:block}

const db=window.supabaseClient;const $=id=>document.getElementById(id);const Q=new URLSearchParams(location.search);const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));const money=n=>Number(n||0).toLocaleString('ar-EG')+' ج.م';const CK='al_mohsen_cart';const toast=m=>{let x=$('toast');if(x){x.textContent=m;x.style.display='block';setTimeout(()=>x.style.display='none',2000)}};async function session(){return(await db.auth.getSession()).data.session}const ADMIN_UID='909bc6ab-d966-49f3-b8e9-3b59d091868c';async function me(){let s=await session();if(!s)return null;let r=(await db.from('profiles').select('*').eq('id',s.user.id).maybeSingle()).data;if(s.user.id===ADMIN_UID)return {...(r||{}),id:s.user.id,account_type:'admin',full_name:r?.full_name||s.user.email};return r}async function guard(){let s=await session();if(!s){location.href='index.html?page=login&next='+encodeURIComponent(location.href);return null}return s}async function logout(){await db.auth.signOut();location.href='index.html'}function guest(){try{return JSON.parse(localStorage.getItem(CK)||'[]')}catch{return[]}}function save(c){localStorage.setItem(CK,JSON.stringify(c))}async function sync(){let s=await session();if(!s)return;const pending=guest();for(const x of pending){const {error}=await db.from('cart_items').upsert({user_id:s.user.id,product_id:x.id,quantity:x.qty},{onConflict:'user_id,product_id'});if(error){console.error('cart sync:',error);toast('تعذر مزامنة السلة؛ لم يتم حذف السلة المحلية');return}}save([])}async function cart(){let s=await session();if(!s)return guest();let {data,error}=await db.from('cart_items').select('id,product_id,quantity,products(id,name,price,image_url,stock)').eq('user_id',s.user.id);if(error){console.error('load cart:',error);toast('تعذر تحميل السلة: '+error.message);return [];}return(data||[]).filter(x=>x.products).map(x=>({...x.products,qty:x.quantity,cart_id:x.id}))}async function add(id){
 try{
  const {data:prod,error:pe}=await db.from('products').select('id,name,price,image_url,stock,is_active').eq('id',id).maybeSingle();
  if(pe)throw pe;
  if(!prod||!prod.is_active){toast('المنتج غير متاح حالياً');return false;}
  const s=await session();
  if(!s){
   const c=guest();
   const item=c.find(x=>String(x.id)===String(id));
   const current=Number(item?.qty||0);
   if(Number(prod.stock)<=current){toast('الكمية المطلوبة غير متاحة');return false;}
   if(item)item.qty=current+1;
   else c.push({...prod,qty:1});
   save(c);
  }else{
   const q=await db.from('cart_items').select('id,quantity').eq('user_id',s.user.id).eq('product_id',id).maybeSingle();
   if(q.error)throw q.error;
   const current=Number(q.data?.quantity||0);
   if(Number(prod.stock)<=current){toast('الكمية المطلوبة غير متاحة');return false;}
   const result=q.data
    ? await db.from('cart_items').update({quantity:current+1}).eq('id',q.data.id).eq('user_id',s.user.id)
    : await db.from('cart_items').insert({user_id:s.user.id,product_id:id,quantity:1});
   if(result.error)throw result.error;
  }
  toast('تمت إضافة المنتج للسلة');
  return true;
 }catch(err){console.error('add to cart:',err);toast('تعذرت الإضافة للسلة: '+(err.message||'خطأ غير معروف'));return false;}
}

 }finally{buyingNow=false;if(btn){btn.disabled=false;btn.textContent='شراء الآن';}}
}

">تعذر تحميل المنتجات.</div>';window.products=data||[];let cats=[...new Set(window.products.map(x=>x.category).filter(Boolean))];$('cats').innerHTML='<button class="cat-btn active" onclick="renderCat(\'كل المنتجات\',this)">كل المنتجات</button>'+cats.map(c=>`<button class="cat-btn" onclick='renderCat(${JSON.stringify(c)},this)'>${esc(c)}</button>`).join('');let nav=$('home-nav');if(nav)nav.innerHTML='<a href="index.html">الرئيسية</a><a href="#categories">الأقسام</a><button class="active" onclick="renderCat(\'كل المنتجات\',null)">كل المنتجات</button>'+cats.map(c=>`<button onclick='renderCat(${JSON.stringify(c)},null)'>${esc(c)}</button>`).join('')+'<a href="index.html?page=orders">طلباتي</a>';renderCat('كل المنتجات');if(Q.get('search')){let si=$('search');if(si)si.value=Q.get('search');filterProducts(Q.get('search'));}}
function filterProducts(q){let v=String(q||'').trim().toLowerCase();renderProductRows((window.products||[]).filter(p=>!v||String(p.name||'').toLowerCase().includes(v)||String(p.description||'').toLowerCase().includes(v)))}

y='grid'"><div class="product-detail-fallback" style="display:${p.image_url?'none':'grid'}">لا توجد صورة</div></div><div class="product-detail-info"><h1>${esc(p.name)}</h1><p class="price">${money(p.price)}</p><p>${esc(p.description||'لا يوجد وصف.')}</p><p>القسم: ${esc(p.category||'غير محدد')}</p><p>المتاح: ${p.stock}</p><p>البائع: ${esc(seller)}</p><div class="product-buy-actions"><button type="button" class="add-product-cart" onclick="add(${JSON.stringify(p.id)})">🛒 أضف للسلة</button> <button type="button" class="buy-product-now" onclick="buyNow(${JSON.stringify(p.id)})">شراء الآن</button> <a class="btn view-product-cart" href="index.html?page=cart">عرض السلة</a></div></div></div></div><div id="reviews" class="card" style="margin-top:18px"><h2>مراجعات العملاء</h2></div>`;let {data:r,error:reviewsError}=await db.from('reviews').select('rating,comment').eq('product_id',id).order('created_at',{ascending:false});$('reviews').innerHTML+=reviewsError?'<p class="muted">تعذر تحميل التقييمات حالياً.</p>':([...(r||[])].map(x=>`<p><b>${'⭐'.repeat(x.rating)}</b> ${esc(x.comment||'')} — عميل</p>`).join('')||'<p class="muted">لا توجد مراجعات.</p>')}async function cartPage(){layout('السلة');let items=await cart();document.querySelector('main').innerHTML='<div class="container"><h1>سلة المشتريات</h1><div id="list"></div></div>';if(!items.length)return $('list').innerHTML='<div class="card empty">السلة فارغة.<br><br><a class="btn" href="index.html">تصفح المنتجات</a></div>';let total=0;$('list').innerHTML='<div class="card">'+items.map(x=>{total+=x.price*x.qty;return `<div class="row cart-line" style="align-items:center;border-bottom:1px solid #eee;padding:12px"><img class="cart-thumb" src="${esc(x.image_url||'')}" alt="${esc(x.name)}" onerror="this.style.display='none'"><div><b>${esc(x.name)}</b><p class="price">${money(x.price)}</p></div><div><button onclick='changeQty(${JSON.stringify(x.id)},${x.qty-1})'>−</button> ${x.qty} <button onclick='changeQty(${JSON.stringify(x.id)},${x.   if(!data){toast('لم يتم حذف المنتج. تحقق من صلاحيات Supabase.');return}
  toast('تم حذف المنتج بنجاح');
  await sellerProducts();
}
window.delProd=delProd;

async function sellerOrders(){layout('طلبات البائع');let s=await guard();if(!s)return;let {data}=await db.from('order_items').select('order_id,quantity,price,products!inner(name,seller_id),orders(status,total_price)').eq('products.seller_id',s.user.id);document.querySelector('main').innerHTML='<div class="container">'+((data||[]).map(x=>`<div class="card" style="margin-bottom:12px"><b>طلب #${x.order_id}</b><p>${esc(x.products.name)} × ${x.quantity}</p><span class="badge">${esc(x.orders.status)}</span></div>`).join('')||'<div class="empty">لا توجد طلبات.</div>')+'</div>'}
const LOGIN_MARKUP = "<div class=\"login-box\"><h1 id=\"storeTitle\">المحسن ستور</h1><h2 id=\"title\">تسجيل الدخول</h2>\n<div id=\"signupFields\" class=\"seller\">\n<label>نوع الحساب<select id=\"accountType\"><option value=\"buyer\">مشتري</option><option value=\"seller\">بائع</option></select></label>\n<label id=\"nameWrap\" class=\"seller\">اسمك بالكامل<input id=\"fullName\" type=\"text\" placeholder=\"الاسم بالكامل\" autocomplete=\"name\"></label>\n<label id=\"storeWrap\" class=\"seller\">اسم المتجر أو النشاط<input id=\"storeName\" type=\"text\" placeholder=\"اسم المتجر\"></label>\n<label id=\"addressWrap\" class=\"seller\">العنوان / مكان النشاط<input id=\"address\" type=\"text\" placeholder=\"العنوان\"></label>\n</div>\n<input id=\"email\" type=\"email\" placeholder=\"البريد الإلكتروني\" autocomplete=\"email\">\n<input id=\"phone\" type=\"tel\" placeholder=\"رقم الهاتف\" autocomplete=\"tel\" style=\"display:none\">\n<input id=\"password\" type=\"password\" placeholder=\"كلمة المرور\" autocomplete=\"current-password\">\n<button id=\"action\" type=\"button\">دخول</button>\n<div class=\"link\"><a href=\"#\" id=\"toggle\">ليس لديك حساب؟ إنشاء حساب</a></div><p id=\"msg\" class=\"msg\" role=\"alert\"></p>\n<p class=\"small\">بيانات البائع الأساسية (الاسم والبريد والهاتف وبيانات النشاط) تصل إلى المدير للمراجعة. كلمة المرور لا يتم حفظها أو إرسالها للمدير.</p></div>\n";
page().catch(e=>{console.error('Store page error:',e);let main=document.querySelector('main');if(main)main.innerHTML='<div class="container"><div class="card empty">حدث خطأ أثناء تحميل الصفحة. حدّث الصفحة، وإذا استمرت المشكلة راجع إعدادات Supabase.<\/div><\/div>'});

async function loginPage(){
 document.body.classList.add('login-mode');
 document.body.innerHTML = `<main>${LOGIN_MARKUP}</main><div id="toast" class="toast"></div>`;
 const loginDb=window.supabaseClient; const login$=id=>document.getElementById(id); let signupMode=false;
 function refreshType(){const seller=login$('accountType').value==='seller';login$('nameWrap').classList.add('show');['storeWrap','addressWrap'].forEach(id=>login$(id).classList.toggle('show',seller));}
 login$('accountType').onchange=refreshType;
 login$('toggle').onclick=e=>{e.preventDefault();signupMode=!signupMode;login$('title').textContent=signupMode?'إنشاء حساب':'تسجيل الدخول';login$('action').textContent=signupMode?'إنشاء الحساب':'دخول';login$('toggle').textContent=signupMode?'لديك حساب؟ تسجيل الدخول':'ليس لديك حساب؟ إنشاء حساب';login$('signupFields').classList.toggle('show',signupMode);login$('phone').style.display=signupMode?'block':'none';login$('msg').textContent='';if(signupMode)refreshType();};
 login$('action').onclick=async()=>{const email=login$('email').value.trim(),password=login$('password').value,phone=login$('phone').value.trim();login$('msg').textContent='';if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){login$('msg').textContent='اكتب بريدًا إلكترونيًا صحيحًا.';return;}if(signupMode&&!phone){login$('msg').textContent='اكتب رقم الهاتف.';return;}if(signupMode&&!/^[0-9+\s()-]{7,20}$/.test(phone)){login$('msg').textContent='اكتب رقم هاتف صحيح.';return;}if(password.length<6){login$('msg').textContent='كلمة المرور يجب أن تكون 6 أحرف على الأقل.';return;}if(signupMode&&!login$('fullName').value.trim()){login$('msg').textContent='اكتب اسمك بالكامل.';return;}if(signupMode&&login$('accountType').value==='seller'&&(!login$('storeName').value.trim()||!login$('address').value.trim())){login$('msg').textContent='اكتب الاسم واسم المتجر والعنوان للبائع.';return;}login$('action').disabled=true;try{if(signupMode){const type=login$('accountType').value;const {data,error}=await loginDb.auth.signUp({email,password,options:{data:{phone,account_type:type,full_name:login$('fullName').value.trim(),store_name:login$('storeName').value.trim(),address:login$('address').value.trim()}}});if(error)throw error;if(data.session){const uid=data.session.user.id;const {data:profile}=await loginDb.from('profiles').select('account_type').eq('id',uid).maybeSingle();const typ=uid===ADMIN_UID?'admin':profile?.account_type;location.href=(Q.get('next')&&Q.get('next').startsWith('index.html'))?Q.get('next'):'index.html?page='+(typ==='seller'?'seller':typ==='admin'?'admin':'buyer');}else login$('msg').textContent=type==='seller'?'تم إنشاء طلب البائع. بعد تأكيد البريد، سيظهر طلبك للمدير للمراجعة.':'تم إنشاء الحساب. إذا ظهر طلب تأكيد البريد، أكّد بريدك ثم سجّل الدخول.';}else{const {data,error}=await loginDb.auth.signInWithPassword({email,password});if(error)throw error;const uid=data.user.id;const {data:profile}=await loginDb.from('profiles').select('account_type').eq('id',uid).maybeSingle();const typ=uid===ADMIN_UID?'admin':profile?.account_type;location.href=(Q.get('next')&&Q.get('next').startsWith('index.html'))?Q.get('next'):'index.html?page='+(typ==='seller'?'seller':typ==='admin'?'admin':'buyer');}}catch(e){login$('msg').textContent=e.message||'حدث خطأ غير متوقع. تأكد من إعداد Supabase ومفتاحه.';}finally{login$('action').disabled=false;}};
}
